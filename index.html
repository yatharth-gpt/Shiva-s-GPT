<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <!-- 🔥 CACHE BUSTER: Prevents old files from loading on Live Server 🔥 -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    
    <title>Nova AI - Universal Assistant</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="manifest" href="manifest.json">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    
    <!-- Auto-Unregister Service Worker during Local Development to fix Ctrl+F5 issue -->
    <script>
        if ('serviceWorker' in navigator && (location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
            navigator.serviceWorker.getRegistrations().then(function(registrations) {
                for(let registration of registrations) { registration.unregister(); }
            });
        }
    </script>
</head>
<body>
    <div id="toastNotification" class="toast">Copied!</div>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-top">
                <button class="new-chat-btn" id="newChatBtn">
                    <i data-lucide="plus"></i> New Chat
                </button>
                <div class="section-title" style="margin-top: 20px; color: var(--text-secondary); font-size: 0.8rem; font-weight: 500; padding-left: 10px;">Recents</div>
                <div class="history-icons" id="chatList"></div>
            </div>
            <div class="sidebar-bottom">
                <button class="icon-btn" id="installPwaBtn" title="Install App" style="display: none; color: #4285f4;"><i data-lucide="download"></i></button>
                <button class="icon-btn" id="themeToggle" title="Theme"><i data-lucide="moon"></i></button>
                <button class="icon-btn" id="researchBtn" title="Tools"><i data-lucide="globe"></i></button>
                <div id="authContainer" class="auth-container">
                    <button id="mockLoginBtn" style="background: var(--text-primary); color: var(--bg-primary); padding: 8px 12px; border-radius: 8px; border: none; cursor: pointer; font-weight: 500;">Sign In</button>
                </div>
                <div id="userProfile" class="user-profile" style="display: none;" title="Logout">
                    <div id="userAvatar" style="width:36px; height:36px; border-radius:50%; background:var(--accent); display:flex; align-items:center; justify-content:center; color:#fff; font-weight:bold; cursor:pointer;">S</div>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="chat-header">
                <button class="icon-btn" id="menuToggle" title="Menu"><i data-lucide="menu"></i></button>
                <select id="aiMode" class="glass-select">
                    <option value="general">Nova Advanced</option>
                    <option value="coding">Code Expert</option>
                </select>
                <div class="header-actions">
                    <button class="icon-btn" id="mainMenuBtn"><i data-lucide="more-vertical"></i></button>
                    <div class="dropdown-menu" id="headerDropdown">
                        <button id="exportPdfBtn"><i data-lucide="download"></i> Download PDF</button>
                        <button id="shareChatBtn"><i data-lucide="share"></i> Share conversation</button>
                    </div>
                </div>
            </header>

            <div class="chat-container" id="chatContainer">
                <div class="welcome-screen" id="welcomeScreen">
                    <div class="welcome-greeting">
                        <span class="gradient-text" id="greetingName">Hello, Shiva</span>
                    </div>
                    <h2 style="color: var(--text-secondary); font-weight:400; margin-top: 10px;">How can I help you today?</h2>
                    
                    <div class="suggestion-grid" style="margin-top: 40px; display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px;">
                        <button class="suggestion-card"><i data-lucide="image"></i><span>Generate a car image</span></button>
                        <button class="suggestion-card"><i data-lucide="monitor-x"></i><span>Fix laptop BSOD error</span></button>
                    </div>
                </div>
                <div class="messages-wrapper" id="messagesWrapper"></div>
            </div>

            <!-- Composer -->
            <div class="composer-container">
                <div id="attachmentPreview" class="attachment-preview" style="display: none;"></div>
                <div class="composer-box pill-shape">
                    <div class="attachment-wrapper">
                        <button class="icon-btn" id="attachBtn" title="Upload Files"><i data-lucide="plus"></i></button>
                        <div class="attach-menu" id="attachMenu">
                            <button id="attachPhotoBtn"><i data-lucide="image"></i> Upload Photo</button>
                            <button id="attachDocBtn"><i data-lucide="file-text"></i> Upload Document</button>
                        </div>
                    </div>
                    
                    <input type="file" id="photoInput" accept="image/*" style="display: none;">
                    <input type="file" id="docInput" accept=".pdf,.txt,.csv,.doc,.docx" style="display: none;">
                    
                    <textarea id="messageInput" placeholder="Message Nova..." rows="1"></textarea>
                    
                    <button class="icon-btn" id="voiceBtn" title="Voice"><i data-lucide="mic"></i></button>
                    <button class="icon-btn" id="cameraBtn" title="Camera"><i data-lucide="camera"></i></button>
                    <button class="send-btn" id="sendBtn"><i data-lucide="send"></i></button>
                </div>
                <div class="composer-footer">Nova can make mistakes. Verify critical info.</div>
            </div>
        </main>
    </div>

    <!-- Modals -->
    <div id="cameraModal" class="modal" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 1000; align-items: center; justify-content: center;">
        <div style="background: var(--bg-primary); padding: 20px; border-radius: 12px; display: flex; flex-direction: column; gap: 10px;">
            <video id="cameraVideo" autoplay playsinline style="max-width: 100%; border-radius: 8px;"></video>
            <canvas id="cameraCanvas" style="display: none;"></canvas>
            <div style="display: flex; gap: 10px; justify-content: flex-end;">
                <button id="captureBtn" style="padding: 10px 20px; background: var(--text-primary); color: var(--bg-primary); border: none; border-radius: 8px; cursor: pointer;">Capture</button>
                <button class="closeModal" style="padding: 10px 20px; background: transparent; border: 1px solid var(--border); color: var(--text-primary); border-radius: 8px; cursor: pointer;">Cancel</button>
            </div>
        </div>
    </div>
    
    <div id="trainModal" class="modal" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 1000; align-items: center; justify-content: center;">
        <div style="background: var(--bg-primary); padding: 24px; border-radius: 12px; display: flex; flex-direction: column; gap: 16px; width: 100%; max-width: 400px;">
            <h3>Check Train Status</h3>
            <input type="text" id="trainNumber" placeholder="Train Number" style="padding: 12px; background: transparent; border: 1px solid var(--border); border-radius: 8px; color: var(--text-primary);">
            <input type="date" id="trainDate" style="padding: 12px; background: transparent; border: 1px solid var(--border); border-radius: 8px; color: var(--text-primary);">
            <div style="display: flex; gap: 10px; justify-content: flex-end;">
                <button id="checkTrainBtn" style="padding: 10px 20px; background: var(--text-primary); color: var(--bg-primary); border: none; border-radius: 8px; cursor: pointer;">Check Status</button>
                <button class="closeModal" style="padding: 10px 20px; background: transparent; border: 1px solid var(--border); color: var(--text-primary); border-radius: 8px; cursor: pointer;">Cancel</button>
            </div>
        </div>
    </div>
    <script type="module" src="app.js"></script>
</body>
</html>
